! Optional edge-router BGP example
hostname EDGE-RTR
service integrated-vtysh-config
!
interface eth0
 description To-CORE-R1
 ip address 10.255.10.2/30
!
router bgp 65010
 bgp router-id 10.255.255.10
 neighbor 10.255.10.1 remote-as 65000
 network 172.16.100.0/24
!
ip route 172.16.100.0/24 Null0
!
line vty
