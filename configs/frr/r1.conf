! Core R1 - FRRouting lab configuration
hostname CORE-R1
service integrated-vtysh-config
!
interface eth0
 description R1-to-R2-primary
 ip address 10.255.0.1/30
 ip ospf network point-to-point
 ip ospf 100 area 0
 ip pim
!
interface eth1
 description R1-to-R2-secondary
 ip address 10.255.0.5/30
 ip ospf network point-to-point
 ip ospf 100 area 0
 ip pim
!
interface eth2
 description Trading-VLAN-gateway
 ip address 10.10.10.1/24
 ip ospf 100 area 0
 ip pim
 ip igmp
!
interface eth3
 description Server-VLAN-gateway
 ip address 10.10.20.1/24
 ip ospf 100 area 0
 ip pim
!
router ospf 100
 ospf router-id 10.255.255.1
 passive-interface eth2
 passive-interface eth3
 network 10.255.0.0/30 area 0
 network 10.255.0.4/30 area 0
 network 10.10.10.0/24 area 0
 network 10.10.20.0/24 area 0
!
router pim
!
ip pim rp 10.255.255.1 239.0.0.0/8
!
line vty
