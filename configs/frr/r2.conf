! Core R2 - FRRouting lab configuration
hostname CORE-R2
service integrated-vtysh-config
!
interface eth0
 description R2-to-R1-primary
 ip address 10.255.0.2/30
 ip ospf network point-to-point
 ip ospf 100 area 0
 ip pim
!
interface eth1
 description R2-to-R1-secondary
 ip address 10.255.0.6/30
 ip ospf network point-to-point
 ip ospf 100 area 0
 ip pim
!
interface eth2
 description Office-VLAN-gateway
 ip address 10.10.30.1/24
 ip ospf 100 area 0
!
interface lo
 ip address 10.255.255.2/32
 ip ospf 100 area 0
!
router ospf 100
 ospf router-id 10.255.255.2
 passive-interface eth2
 network 10.255.0.0/30 area 0
 network 10.255.0.4/30 area 0
 network 10.10.30.0/24 area 0
 network 10.255.255.2/32 area 0
!
line vty
